name: SonarView
on:
  schedule:
    - cron: "0 6 * * *" # daily at 6 am
  workflow_dispatch:
    inputs:
      updaterev:
        type: string
        description: which hg revision to pull
        default: "@"
      release:
        type: boolean
        description: Create a draft release?
        default: false
defaults:
  run:
    shell: bash
jobs:
  # Fetches the hg revision to build, and caches its repository for the other jobs, which check it
  # out from there. Outputs its changeset, and its version, from the root package.json, which is
  # the canonical version: the release's tag is v<version>. For a release, creates the draft
  # release if there isn't one.
  checkout:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      rev: ${{ steps.checkout.outputs.rev }}
      version: ${{ steps.checkout.outputs.version }}
      tag: ${{ steps.checkout.outputs.tag }}
    steps:
    - name: setup ssh
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        echo -e "Host *\n  StrictHostKeyChecking accept-new\n" >> ~/.ssh/config
        chmod -R 700 ~/.ssh
        ssh -T hg@codebasehq.com || [ $? -eq 1 ] || exit $?
    # Ubuntu 26.04's runner image has no Mercurial
    - name: Install software
      run: sudo apt-get update && sudo apt-get install -y mercurial
    # An earlier run's repository, if there is one, so this only pulls what's new
    - name: Restore repository
      uses: actions/cache/restore@v6
      with:
        path: .hg
        key: sonarview-hg-${{ github.run_id }}
        restore-keys: sonarview-hg-
        enableCrossOsArchive: true
    - name: Mercurial Pull
      id: checkout
      run: |
        source=ssh://hg@codebasehq.com/digi-labs/cerulean/sonarview.hg
        if [ -d .hg ]; then
          hg pull "$source"
        else
          hg clone --noupdate "$source" .
        fi
        rev=$(hg log -r "${{ inputs.updaterev || '@' }}" --template '{node}')
        version=$(hg cat -r "$rev" package.json | jq -r .version)
        echo "rev=$rev" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "tag=v$version" >> "$GITHUB_OUTPUT"
        echo "Building $version from $rev" >> "$GITHUB_STEP_SUMMARY"
    - name: Cache repository
      uses: actions/cache/save@v6
      with:
        path: .hg
        key: sonarview-hg-${{ steps.checkout.outputs.rev }}
        enableCrossOsArchive: true
    - name: Create draft release
      if: ${{ inputs.release }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ steps.checkout.outputs.tag }}
        VERSION: ${{ steps.checkout.outputs.version }}
      run: |
        if is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
          if [ "$is_draft" != true ]; then
            echo "::error::Release $TAG is already published. Bump the version in package.json."
            exit 1
          fi
        else
          gh release create "$TAG" --draft --title "$VERSION" --notes ""
        fi

  # Builds the desktop app, and uploads its installers and update files as the workflow artifact
  # electron-<os>. For a release, also attaches them to the draft release the checkout job made.
  build:
    needs: checkout
    permissions:
      # to attach the build to the draft release
      contents: write
    strategy:
      matrix:
        # note that we can't build for macOS from Linux
        runner: [macos-latest, windows-2025, ubuntu-26.04]
      fail-fast: false
    runs-on:  ${{ matrix.runner }}
    continue-on-error: ${{ matrix.runner == 'macos-latest' }}
    steps:
    - name: Install software
      if: runner.os == 'macOS'
      run: |
        brew install mercurial
    - name: Install software
      if: runner.os == 'Windows'
      run: |
        choco install hg --no-progress -y
        echo "C:/Program Files/Mercurial" >> "$GITHUB_PATH"
    - name: Install software
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y mercurial
    - name: Restore repository
      uses: actions/cache/restore@v6
      with:
        path: .hg
        key: sonarview-hg-${{ needs.checkout.outputs.rev }}
        enableCrossOsArchive: true
        fail-on-cache-miss: true
    - name: Mercurial Checkout
      run: hg update --clean -r "${{ needs.checkout.outputs.rev }}"
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 26.5.0
        cache: npm
    - name: Prebuild
      run: |
        npm ci --foreground-scripts
    - name: Add code signing dependencies
      if: runner.os == 'macOS'
      env:
        APPLE_CSC_BASE64: ${{ secrets.APPLE_CSC_BASE64 }}
        APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      run: |
        echo "$APPLE_CSC_BASE64" | base64 --decode -o "$RUNNER_TEMP/AppleCSC.p12"
        echo "$APPLE_API_KEY_BASE64" | base64 --decode -o "$RUNNER_TEMP/AppStoreConnect.p8"
    - name: Build
      # mac notarization can time out at the server-side
      timeout-minutes: 15
      run: |
        # Not published: the step below attaches the build to the draft release
        npx quasar build -m electron -P never
      env:
        # Trusted Signing (for Windows)
        AZURE_TENANT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_TENANT_ID || '' }}
        AZURE_CLIENT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_ID || '' }}
        AZURE_CLIENT_SECRET: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_SECRET || '' }}
        # Signing and notarization (for macOS)
        CSC_LINK: ${{ runner.os == 'macOS' && format('{0}/AppleCSC.p12', runner.temp) || '' }}
        CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CSC_PASSWORD || '' }}
        APPLE_API_KEY: ${{ runner.os == 'macOS' && format('{0}/AppStoreConnect.p8', runner.temp) || '' }}
        APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_ID || '' }}
        APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
    # The installers, and electron-builder's update files (*.yml, *.blockmap)
    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: electron-${{ runner.os }}
        path: |
          dist/electron/Packaged/*.exe
          dist/electron/Packaged/*.dmg
          dist/electron/Packaged/*.zip
          dist/electron/Packaged/*.AppImage
          dist/electron/Packaged/*.blockmap
          dist/electron/Packaged/*.yml
          !dist/electron/Packaged/builder-debug.yml
        if-no-files-found: error
        # Installers are large, and every run makes them
        retention-days: 14
    - name: Attach build to draft release
      if: ${{ inputs.release }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ needs.checkout.outputs.tag }}
      working-directory: dist/electron/Packaged
      run: |
        # electron-builder's own records of the build, not part of it
        rm -f builder-debug.yml builder-effective-config.yaml
        # The rest of the files: installers and update files. Not the unpacked apps' directories.
        find . -maxdepth 1 -type f -exec gh release upload "$TAG" --clobber {} +
        find . -maxdepth 1 -type f >> "$GITHUB_STEP_SUMMARY"

  # Builds the docker image for every platform (src-docker/compose.yaml) and pushes it to
  # ghcr.io/ceruleansonar/sonarview, run-<run>.<attempt>, which names exactly this run's image. Attaches sonarview-docker-image.txt to the draft release so that it can be transferred to dockerhub on publish.
  docker:
    needs: checkout
    runs-on: ubuntu-26.04
    permissions:
      # to attach the image's reference to the draft release
      contents: write
      # to push the image to ghcr.io
      packages: write
    steps:
    - name: Install software
      run: sudo apt-get update && sudo apt-get install -y mercurial
    - name: Restore repository
      uses: actions/cache/restore@v6
      with:
        path: .hg
        key: sonarview-hg-${{ needs.checkout.outputs.rev }}
        enableCrossOsArchive: true
        fail-on-cache-miss: true
    - name: Mercurial Checkout
      run: hg update --clean -r "${{ needs.checkout.outputs.rev }}"
    # To push the image, and to pull the os3d image that compose.yaml pins
    - name: Log in to ghcr.io
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push
      env:
        npm_package_version: ${{ needs.checkout.outputs.version }}
      run: |
        ref="ghcr.io/ceruleansonar/sonarview:run-${{ github.run_id }}.${{ github.run_attempt }}"
        docker compose -f src-docker/compose.yaml -f - build --push <<EOF
        services:
           server:
              image: $ref
              build:
                 platforms: [linux/amd64, linux/arm64, linux/arm/v7]
                 labels:
                    org.opencontainers.image.revision: ${{ needs.checkout.outputs.rev }}
        EOF
        mkdir -p "$RUNNER_TEMP/docker-image"
        echo "$ref" > "$RUNNER_TEMP/docker-image/sonarview-docker-image.txt"
        echo "Pushed \`$ref\`" >> "$GITHUB_STEP_SUMMARY"
    - name: Upload image reference
      uses: actions/upload-artifact@v7
      with:
        name: docker-image
        path: ${{ runner.temp }}/docker-image/
        if-no-files-found: error
    - name: Attach image reference to draft release
      if: ${{ inputs.release }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ needs.checkout.outputs.tag }}
      run: gh release upload "$TAG" --clobber "$RUNNER_TEMP/docker-image/sonarview-docker-image.txt"
